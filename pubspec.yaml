name: pawwalk
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Local Storage
  sqflite: ^2.3.3+3
  shared_preferences: ^2.3.2
  path: ^1.9.0

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI
  smooth_page_indicator: ^1.2.0+3
  fl_chart: ^0.69.0

  # State Management
  provider: ^6.1.2

  # Calendar
  table_calendar: ^3.1.2
  intl: ^0.20.2
  syncfusion_flutter_charts: ^28.1.38

  cupertino_icons: ^1.0.8

  # Networking & Utils
  http: ^1.2.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
